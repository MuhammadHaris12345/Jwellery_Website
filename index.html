<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jewellery Shop Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f8f3e9;--card:#fffdf8;--tx:#2a211c;--gold:#b8892b;--gold2:#e8c46a;--deep:#0c3b2e;--mar:#6e1a28;--bd:#e7d9b6;--sh:0 6px 24px rgba(60,40,10,.10);--hd:'Cormorant Garamond','Cormorant Garamond','Playfair Display',serif}
body.dark{--bg:#0d0b09;--card:#181410;--tx:#f1e8d4;--bd:#3b3225;--sh:0 6px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:300 14px/1.6 Poppins,sans-serif;background:var(--bg) radial-gradient(1200px 500px at 85% -10%,rgba(232,196,106,.18),transparent 60%);color:var(--tx);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--hd);font-weight:700;letter-spacing:.04em;margin:.3em 0;color:var(--gold)}
h2{font-size:30px;background:linear-gradient(90deg,#8a6420,#e8c46a 50%,#a77a22);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{font-size:22px}
nav{position:fixed;left:0;top:0;bottom:0;width:190px;background:linear-gradient(180deg,#0c3b2e,#06201a);padding:14px 10px;overflow:auto;border-right:1px solid #b8892b66;box-shadow:4px 0 24px rgba(0,0,0,.25)}
nav b{display:block;font:700 22px var(--hd);letter-spacing:.08em;color:var(--gold2);text-align:center;padding:10px 4px 16px;margin-bottom:8px;border-bottom:1px solid #e8c46a44}
nav a{display:block;color:#efe6cf;padding:10px 12px;margin:2px 0;border-radius:3px;cursor:pointer;font-weight:400;letter-spacing:.06em;font-size:13px;border-left:3px solid transparent;transition:.25s}
nav a.on,nav a:hover{background:linear-gradient(90deg,#e8c46a22,transparent);border-left-color:var(--gold2);color:var(--gold2)}
main{margin-left:190px;padding:22px 26px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px;margin:10px 0;box-shadow:var(--sh);transition:transform .3s,box-shadow .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.grid>.card{margin:0}
.grid .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(120,85,20,.18)}
.kpi{border-top:2px solid var(--gold)}.kpi small{text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:#8a7a5a}
.kpi b{display:block;font:700 26px var(--hd);color:var(--deep);letter-spacing:.02em}body.dark .kpi b{color:var(--gold2)}
button,input,select,textarea{font:inherit;padding:8px 12px;border-radius:3px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%;transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,137,43,.18)}
button{background:linear-gradient(135deg,#e8c46a,#b8892b 55%,#9a7220);color:#1d1407;border:0;cursor:pointer;margin:3px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;box-shadow:0 2px 8px rgba(184,137,43,.35)}
button:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 14px rgba(184,137,43,.45)}
button.s{background:linear-gradient(135deg,#145a45,#0c3b2e);color:var(--gold2);border:1px solid #e8c46a77;box-shadow:0 2px 8px rgba(12,59,46,.35)}
button.r{background:linear-gradient(135deg,#8a2234,#5a1220);color:#f6e4c0;box-shadow:0 2px 8px rgba(110,26,40,.35)}
table{width:100%;border-collapse:collapse}th{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:600}
td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left}tr:hover td{background:rgba(232,196,106,.08)}
.wrap{overflow-x:auto}.tag{background:linear-gradient(135deg,#f3e6bd,#ead9a0);color:#5a4210;border-radius:2px;padding:1px 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
body.dark .tag{background:#3b3225;color:var(--gold2)}
#toast{position:fixed;right:14px;top:14px;background:var(--deep);color:var(--gold2);border:1px solid var(--gold);padding:11px 18px;border-radius:3px;display:none;z-index:99;box-shadow:var(--sh);letter-spacing:.04em}
#modal{position:fixed;inset:0;background:rgba(8,6,4,.62);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}
#modal>div{background:var(--card);padding:20px;border-radius:6px;border:1px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.45);width:min(440px,94vw);max-height:90vh;overflow:auto}
#modal label{display:block;margin:8px 0 3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}#modal input,#modal select,#modal textarea{width:100%}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-left:3px solid var(--gold);padding:10px;border-radius:3px;font:300 13px/1.6 Poppins,sans-serif}
a{color:var(--gold)}
.sh{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 28px;background:rgba(6,32,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid #e8c46a66;flex-wrap:wrap}
.sh a{color:#efe6cf;margin:0 12px;text-decoration:none;letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;font-weight:400}.sh a:hover{color:var(--gold2)}
.logo{font:700 28px var(--hd);letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,#e8c46a,#fff2c4,#b8892b);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{position:relative;text-align:center;padding:120px 16px 110px;color:#f4ead0;background:radial-gradient(700px 320px at 50% 0,rgba(232,196,106,.22),transparent 70%),linear-gradient(135deg,#06201a,#0c3b2e 45%,#4a1220);overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;left:50%;width:1px;height:46px;background:linear-gradient(var(--gold2),transparent)}.hero:before{top:0}.hero:after{display:none}
.hero h1{font-size:clamp(40px,7vw,78px);letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px;background:linear-gradient(90deg,#c99a3a,#fff0bd 50%,#c99a3a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.hero p{font:italic 400 clamp(18px,2.6vw,26px) var(--hd);letter-spacing:.06em;color:#e9dcb8;margin:6px 0 28px}.hero a{text-decoration:none}
.hero button{padding:12px 26px;font-size:12px;margin:5px}
.sec{padding:36px 22px;max-width:1120px;margin:auto}.sec>h2{text-align:center}
.sec>h2:after{content:"";display:block;width:70px;height:2px;margin:8px auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.pg{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.pg .card{padding:10px;border-radius:4px;overflow:hidden}
.pimg{position:relative;height:230px;border-radius:3px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#7a1f2b,#26080f);display:flex;align-items:center;justify-content:center;color:var(--gold2);font:700 26px var(--hd);letter-spacing:.08em;text-align:center;padding:10px;border:1px solid #e8c46a55}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}.pg .card:hover .pimg img{transform:scale(1.07)}
.pg p{margin:12px 4px 6px;line-height:1.7}.pg p b:first-child{font:700 20px var(--hd);letter-spacing:.04em}
footer.sec{text-align:center;border-top:1px solid var(--bd);color:#8a7a5a;letter-spacing:.08em}
#botb{position:fixed;right:16px;bottom:70px;width:56px;height:56px;border-radius:50%;font-size:24px;z-index:40;padding:0;box-shadow:0 6px 20px rgba(184,137,43,.55);border:2px solid #fff2c4}
#bot{position:fixed;right:14px;bottom:136px;width:min(370px,94vw);height:min(500px,64vh);background:var(--card);border:1px solid var(--gold);border-radius:8px;z-index:40;display:none;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#bm{flex:1;overflow:auto;padding:10px}.m{max-width:90%;margin:5px 0;padding:8px 12px;border-radius:4px 12px 12px 12px;font-size:13px}.bt{background:var(--bd);color:#2a211c}body.dark .bt{color:#f1e8d4}
.me{background:linear-gradient(135deg,#145a45,#0c3b2e);color:#f4ead0;margin-left:auto;border-radius:12px 4px 12px 12px}
#bc{padding:4px 8px;max-height:78px;overflow:auto}.chip{display:inline-block;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:2px 11px;margin:2px;font-size:11.5px;cursor:pointer;letter-spacing:.03em}.chip:hover{background:var(--gold);color:#1d1407}
@media(max-width:700px){nav{top:auto;width:100%;height:auto;display:flex;overflow-x:auto;padding:4px;border-right:0;border-top:1px solid #b8892b66}nav b{display:none}nav a{white-space:nowrap;padding:12px 10px;border-left:0;border-bottom:3px solid transparent}nav a.on,nav a:hover{border-bottom-color:var(--gold2)}main{margin:0 0 64px;padding:12px}.sh{padding:10px 14px}.sh a{margin:0 6px}.hero{padding:80px 12px 70px}h2{font-size:26px}}
@media print{nav,button,#toast,#botb,#bot{display:none}main{margin:0}body{background:#fff}}
</style></head><body>
<div id="toast"></div><div id="modal"><div id="mbox"></div></div>
<div id="site" style="display:none"></div><nav id="nav" style="display:none"></nav><main id="main" style="display:none"></main><button id="botb" title="Assistant">💬</button><div id="bot"><div style="padding:8px 10px;background:var(--deep);color:#e8c46a;display:flex;justify-content:space-between"><b>🤖 Assistant</b><span id="bx" style="cursor:pointer">✕</span></div><div id="bm"></div><div id="bc"></div><div style="display:flex;gap:4px;padding:6px"><input id="bi" placeholder="Likhein..." style="flex:1"><button id="bs">Send</button></div></div>
<script>
(()=>{'use strict';
const TOLA=11.664,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('en-US'),today=()=>new Date().toISOString().slice(0,10);
const dd=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-');
/* ---- Storage ---- */
const S={get(k,d){try{const v=localStorage.getItem('jwl_'+k);return v?JSON.parse(v):d}catch(e){return d}},
set(k,v){try{localStorage.setItem('jwl_'+k,JSON.stringify(v));return true}catch(e){toast('Storage full! Backup export karein aur purani photos hataein.');return false}}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3000)};
let cfg=S.get('settings',null);
const nid=(p,arr)=>p+'-'+String(arr.length+1).padStart(4,'0');
/* ---- Language ---- */
const L={en:{dash:'Dashboard',rates:'Gold Rate',stock:'Inventory',cust:'Customers',pos:'Billing',orders:'Orders',mkt:'Marketing',set:'Settings'},
ru:{dash:'Dashboard',rates:'Sone ka Rate',stock:'Stock / Zewar',cust:'Customers',pos:'Bill / Sale',orders:'Orders',mkt:'Marketing Kit',set:'Settings'},
ur:{dash:'ڈیش بورڈ',rates:'سونے کا ریٹ',stock:'اسٹاک',cust:'گاہک',pos:'بل',orders:'آرڈرز',mkt:'مارکیٹنگ',set:'سیٹنگز'}};
const t=k=>(L[cfg.lang]||L.en)[k];
/* ---- Demo data ---- */
function seed(){
const names=['Ayesha Khan','Fatima Malik','Hina Siddiqui','Sana Qureshi','Bilal Ahmed','Usman Sheikh','Zainab Raza','Hamza Chaudhry','Maryam Baig','Imran Butt'],cities=['Karachi','Lahore','Islamabad','Faisalabad','Multan','Peshawar','Hyderabad'];
S.set('customers',names.map((n,i)=>({id:'C-'+String(i+1).padStart(4,'0'),name:n,phone:'03'+(10+i)+'-'+(1234500+i*111),city:cities[i%7],tag:['VIP','Regular','Bridal'][i%3],balance:i%3==0?(i+1)*15000:0})));
S.set('karigars',['Ustad Rafiq','Usman Sunar','Ghulam Nabi','Sajid Karigar'].map((n,i)=>({id:'K-'+(i+1),name:n,gold:0})));
const items=[['Bridal Set','Set',22,48.5,6],['Rani Haar','Haar',22,62,8],['Jhumka','Jhumka',21,9.2,5],['Kangan Pair','Kangan',22,35,6],['Anguthi','Anguthi',21,6.5,5],['Chain','Chain',18,14,4],['Choorian (4)','Choorian',22,40,6],['Locket','Locket',21,5.8,5],['Nath','Nath',22,4.2,6],['Bali','Bali',18,3.6,4],['Payal Pair','Payal',0,70,3],['Tika','Tika',21,8.1,5]];
const inv=items.map((x,i)=>({code:'AN-'+String(i+1).padStart(4,'0'),name:x[0],cat:x[1],metal:x[2]?'Gold':'Silver',karat:x[2]||0,net:x[3],wastagePct:x[4],makingType:'tola',making:x[2]?9000:1500,stone:i%4==0?25000:0,cost:Math.round(x[3]/TOLA*(x[2]?300000:4000)*.97),qty:1+i%3,status:'In Stock',loc:'Showcase'}));
S.set('inventory',inv);let r24=312000;const rates=[];
for(let d=30;d>=0;d--){r24+=Math.round((Math.random()-.45)*3000);const dt=new Date(Date.now()-d*864e5);rates.push({t:dt.toISOString(),r24,silver:4200+Math.round(Math.random()*100)})}
S.set('rates',rates);S.set('sales',[]);
S.set('orders',[{id:'O-0001',cust:'Ayesha Khan',desc:'Bridal set, 22K, temple design',est:50,advance:100000,due:today(),status:'In Making',lock:true}]);
S.set('marketing',{streak:0,done:[]});}
/* ---- Calc ---- */
const lastRate=()=>{const r=S.get('rates',[]);return r[r.length-1]||{r24:0,silver:0}};
const prevRate=()=>{const r=S.get('rates',[]);return r[r.length-2]||lastRate()};
function price(it,rate=lastRate()){
const base=it.metal=='Gold'?it.net/TOLA*rate.r24*it.karat/24:it.net*(rate.silver/TOLA);
const was=base*(it.wastagePct||0)/100,mk=it.makingType=='fixed'?it.making:it.makingType=='gram'?it.making*it.net:it.making*it.net/TOLA;
return{base,was,mk,stone:+it.stone||0,total:Math.round(base+was+mk+(+it.stone||0))}}
/* ---- Modal form builder ---- */
function form(title,fields,cb){
$('#mbox').innerHTML='<h3>'+title+'</h3>'+fields.map(f=>'<label>'+f.l+'</label>'+(f.o?'<select name="'+f.n+'">'+f.o.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>':'<input name="'+f.n+'" type="'+(f.t||'text')+'" value="'+esc(f.v??'')+'">')).join('')+'<p><button id="ok">Save</button><button class="r" id="no">Cancel</button></p>';
$('#modal').style.display='flex';$('#no').onclick=()=>$('#modal').style.display='none';
$('#ok').onclick=()=>{const o={};for(const f of fields){const v=$('#mbox [name='+f.n+']').value.trim();if(f.req&&!v)return toast(f.l+' zaroori hai');o[f.n]=f.t=='number'?+v||0:v}$('#modal').style.display='none';cb(o)}}
const copyBtn=txt=>'<button class="s" data-copy="'+esc(txt).replace(/\n/g,'&#10;')+'">Copy</button>';
/* ---- Views ---- */
const V={};let chart;
V.dash=()=>{const inv=S.get('inventory',[]),sales=S.get('sales',[]),ord=S.get('orders',[]),c=S.get('customers',[]),lr=lastRate(),pr=prevRate();
const tdy=sales.filter(s=>s.date==today()).reduce((a,s)=>a+s.total,0),stockVal=inv.reduce((a,i)=>a+price(i).total*i.qty,0),ud=c.reduce((a,x)=>a+(x.balance||0),0);
const month=today().slice(0,7),profit=sales.filter(s=>s.date.startsWith(month)).reduce((a,s)=>a+s.profit,0);
const stale=new Date(lr.t).toISOString().slice(0,10)!=today();
return`${stale?'<div class="card" style="border-color:var(--mar)">⚠ Aaj ka rate update nahi hua. <button data-go="rates">Update Rate</button></div>':''}
<h2>${t('dash')}</h2><div class="card"><b>24K:</b> Rs. ${fmt(lr.r24)}/tola ${lr.r24>=pr.r24?'▲':'▼'} ${fmt(Math.abs(lr.r24-pr.r24))} &nbsp;|&nbsp; <b>22K:</b> ${fmt(lr.r24*22/24)} &nbsp;<b>21K:</b> ${fmt(lr.r24*21/24)} &nbsp;<b>18K:</b> ${fmt(lr.r24*18/24)} &nbsp;|&nbsp; <b>Silver:</b> ${fmt(lr.silver)}/tola<br><small>Updated: ${dd(lr.t)}</small></div>
<div class="grid">${[['Aaj ki sale','Rs. '+fmt(tdy)],['Pending orders',ord.filter(o=>!['Delivered','Cancelled','Ready'].includes(o.status)).length],['Ready orders',ord.filter(o=>o.status=='Ready').length],['Gold stock (g)',inv.filter(i=>i.metal=='Gold').reduce((a,i)=>a+i.net*i.qty,0).toFixed(1)],['Stock value','Rs. '+fmt(stockVal)],['Udhaar','Rs. '+fmt(ud)],...(cfg.role=='Owner'?[['Is mahine ka profit','Rs. '+fmt(profit)]]:[])].map(k=>'<div class="card kpi"><small>'+k[0]+'</small><b>'+k[1]+'</b></div>').join('')}</div>
<div class="card"><canvas id="ch" height="120"></canvas></div>
<p><button data-go="pos">New Sale</button><button data-go="orders">New Order</button><button data-go="stock">Add Item</button><button data-go="rates">Update Rate</button><button class="s" data-go="mkt">Aaj ka Marketing Kit</button></p>`};
V.dash.after=()=>{const r=S.get('rates',[]).slice(-30);chart&&chart.destroy();chart=new Chart($('#ch'),{type:'line',data:{labels:r.map(x=>dd(x.t).slice(0,6)),datasets:[{label:'24K per tola',data:r.map(x=>x.r24),borderColor:'#b8892b',tension:.3}]}})};
V.rates=()=>{const r=S.get('rates',[]),lr=lastRate();
return`<h2>${t('rates')}</h2><div class="card"><input id="r24" type="number" placeholder="24K per tola" value="${lr.r24}"> <input id="rs" type="number" placeholder="Silver per tola" value="${lr.silver}"> <button data-act="saveRate">Save Rate</button><button class="s" data-act="fetchRate">Fetch Latest Rate</button><button class="s" data-act="rateCard">Rate Card PNG</button><button class="s" data-act="aiRate">AI Summary</button>
<p>22K: ${fmt(lr.r24*22/24)} | 21K: ${fmt(lr.r24*21/24)} | 18K: ${fmt(lr.r24*18/24)} | per gram 24K: ${fmt(lr.r24/TOLA)}</p>
<p><b>Converter:</b> <input id="cv" type="number" placeholder="Tola" style="width:90px"> <span id="cvo"></span></p></div><div id="aiout"></div><canvas id="rc" style="display:none"></canvas>
<div class="card wrap"><table><tr><th>Date</th><th>24K</th><th>22K</th><th>Silver</th></tr>${r.slice().reverse().slice(0,15).map(x=>'<tr><td>'+dd(x.t)+'</td><td>'+fmt(x.r24)+'</td><td>'+fmt(x.r24*22/24)+'</td><td>'+fmt(x.silver)+'</td></tr>').join('')}</table></div>`};
V.stock=()=>{const inv=S.get('inventory',[]);return`<h2>${t('stock')}</h2><input id="q" placeholder="Search code/name/category..." oninput="window._f()"><button data-act="addItem">+ Add Item</button><button class="s" data-act="stAllB">🏷 Sab Stickers</button><div id="list" class="card wrap"></div>`};
V.stock.after=()=>{window._f=()=>{const q=$('#q').value.toLowerCase(),inv=S.get('inventory',[]).filter(i=>(i.code+i.name+i.cat).toLowerCase().includes(q));
$('#list').innerHTML='<table><tr><th>Code</th><th>Item</th><th>Karat</th><th>Net g</th><th>Price</th><th>Qty</th><th></th></tr>'+inv.map(i=>'<tr><td>'+i.code+'</td><td><img src="images/'+imgName(i)+'.jpeg" width="34" height="34" style="object-fit:cover;border-radius:6px;vertical-align:middle" onerror="this.remove()"> '+esc(i.name)+' <span class="tag">'+i.cat+'</span></td><td>'+(i.metal=='Gold'?i.karat+'K':'Silver')+'</td><td>'+i.net+'</td><td>Rs. '+fmt(price(i).total)+'</td><td>'+i.qty+'</td><td>'+socBtns(i.code)+'<button class="r" data-act="delItem" data-id="'+i.code+'">x</button></td></tr>').join('')+'</table>'||'<p>Koi item nahi. Add Item dabayein.</p>'};window._f()};
V.cust=()=>{const c=S.get('customers',[]);return`<h2>${t('cust')}</h2><button data-act="addCust">+ Add Customer</button><div class="card wrap"><table><tr><th>Name</th><th>Phone</th><th>City</th><th>Tag</th><th>Balance</th><th></th></tr>${c.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.phone+'</td><td>'+x.city+'</td><td><span class="tag">'+x.tag+'</span></td><td>'+fmt(x.balance)+'</td><td><a href="https://wa.me/92'+x.phone.replace(/\D/g,'').slice(1)+'" target="_blank"><button class="s">WhatsApp</button></a></td></tr>').join('')}</table></div>`};
V.pos=()=>{const inv=S.get('inventory',[]).filter(i=>i.qty>0),c=S.get('customers',[]);
return`<h2>${t('pos')}</h2><div class="card"><input id="pscan" placeholder="📷 Barcode scan karein ya code likh kar Enter dabayein" style="width:100%;margin-bottom:8px"><select id="pc">${c.map(x=>'<option>'+esc(x.name)+'</option>').join('')}</select> <select id="pm"><option>Cash</option><option>Bank Transfer</option><option>JazzCash</option><option>Easypaisa</option><option>Cheque</option></select>
